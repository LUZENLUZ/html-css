<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
<style>
    body {
font-family: Arial, Helvetica, sans-serif;
    }

    a {
        color: red;
        text-decoration: none;
        font-weight: bold;

    }
    a:visited{
        color: darkred;
        
    }

    a:hover{
        text-decoration: underline;
    }

    a:active {
        color: blue;
    }
</style>
    
</head>
<body>


    <h1>personalizando links</h1>
    <ul>
<li><a href="https://github.com/" target="_blank">repositorio github </a></li>
<li><a href="https://www.youtube.com/@cursoemvideo" target="_blank">youtube</a></li>
<li><a href="https://www.instagram.com/" target="_blank">insta </a></li>
    </ul>
</body>
</html>

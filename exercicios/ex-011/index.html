<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em html5

    </title>
</head>
<body>
    <h1>imagem dinamica</h1>
    <p>tente abrir essas imagens em varios dispositivos diferentes, ou aumente e diminue o tamanho do seu navegador</p>
    <picture>
         
        <source media="(max-width: 750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">
         <img src="imagens/foto-g.png" alt="img flexivel">


         <h1>reproduzindo audios</h1>
         <p>aprendendo a reproduzir audio</p>
         <audio 
         src="midia/musica.mp3" controls autoplay>


         </audio>   
    </picture>
</body>
</html>
